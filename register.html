<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Moda Resale | Authenticated Luxury Consignment</title>
  <meta name="description" content="Create your Moda Resale private client account to consign luxury designer items, access exclusive private vault viewings, and request forensic provenance certificates.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <main class="auth-split-layout auth-reverse">
    
    <!-- LEFT PANE: Modern Luxury Registration Form -->
    <div class="auth-form-pane">
      <div class="auth-form-card">
        
        <span class="auth-kicker">— ACCOUNT REGISTRATION</span>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Moda Resale to track bookings, private vault viewings &amp; save your rituals.</p>

        <form onsubmit="event.preventDefault(); modaToast('Account successfully created! Welcome to Moda Resale VIP.'); setTimeout(() => window.location.href='index.html', 1400);">
          
          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="regName" style="text-transform:uppercase; font-size:0.75rem; letter-spacing:0.06em;">FULL NAME</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter your full name" required autocomplete="name">
          </div>

          <!-- Email Address -->
          <div class="form-group">
            <label class="form-label" for="regEmail" style="text-transform:uppercase; font-size:0.75rem; letter-spacing:0.06em;">EMAIL ADDRESS</label>
            <input type="email" id="regEmail" class="form-control" placeholder="you@email.com" required autocomplete="email">
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label class="form-label" for="regPhone" style="text-transform:uppercase; font-size:0.75rem; letter-spacing:0.06em;">PHONE NUMBER</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+1 (555) 019-2834" required autocomplete="tel">
          </div>

          <!-- Password with Eye Toggle -->
          <div class="form-group">
            <label class="form-label" for="regPassword" style="text-transform:uppercase; font-size:0.75rem; letter-spacing:0.06em;">PASSWORD</label>
            <div class="auth-input-wrap">
              <input type="password" id="regPassword" class="form-control" placeholder="Create password (8+ chars)" required minlength="8" autocomplete="new-password">
              <button type="button" class="password-toggle-btn" data-action="toggle-password" data-target="regPassword" title="Show or hide password" aria-label="Toggle password visibility">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Terms Agreement -->
          <div class="auth-meta-row" style="margin-bottom: 1.5rem;">
            <label class="auth-checkbox-label" style="align-items:flex-start; line-height:1.4;">
              <input type="checkbox" id="agreeTerms" required style="margin-top:2px;">
              <span>I AGREE TO THE <a href="#" onclick="event.preventDefault(); modaToast('Terms of Service & Privacy Policy: 100% data protection & encrypted records.');" class="auth-link">TERMS OF SERVICE</a> &amp; <a href="#" onclick="event.preventDefault(); modaToast('Privacy Policy: We never share client records.');" class="auth-link">PRIVACY POLICY</a></span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-gradient auth-submit-btn">CREATE ACCOUNT</button>

          <!-- Switch to Login -->
          <p class="auth-switch-text">
            Already have an account? <a href="login.html">Log in</a>
          </p>

          <div style="text-align:center; margin-top:2rem;">
            <a href="index.html" class="auth-link" style="font-size:0.82rem; color:var(--text-muted); display:inline-flex; align-items:center; gap:0.35rem;">
              <span>← Return to Boutique Home</span>
            </a>
          </div>

        </form>

      </div>
    </div>

    <!-- RIGHT PANE: Visual Editorial Banner -->
    <div class="auth-visual-pane" style="background-image: url('assets/images/boutique/auth_register_visual.jpg');">
      <div class="auth-visual-overlay"></div>

      <!-- Top Overlay Controls -->
      <header class="auth-visual-header">
        <a href="index.html" class="brand-link">
          <span class="brand-mark"><img src="assets/images/logo.svg" alt="Moda Resale Monogram Logo" width="36" height="36"></span>
          <div class="brand-title">MODA<span>RESALE</span></div>
        </a>

        <div class="auth-visual-controls">
          <!-- Dark / Light Mode Toggle -->
          <button type="button" class="auth-ctrl-btn" data-action="toggle-theme" title="Toggle color scheme" aria-label="Toggle dark mode">
            <span class="theme-icon-slot">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </span>
          </button>

          <!-- RTL Direction Toggle -->
          <button type="button" class="auth-ctrl-btn rtl-pill" data-action="toggle-dir" title="Toggle RTL layout" aria-label="Toggle text direction">
            <span style="display:inline-flex; align-items:center; gap:0.3rem;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16l-4-4m0 0l4-4m-4 4h18"/><path d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
              <span>RTL</span>
            </span>
          </button>
        </div>
      </header>

      <!-- Bottom Headline -->
      <div class="auth-visual-footer">
        <span class="auth-kicker">— JOIN MODA RESALE</span>
        <h2>Salon-quality care,<br>delivered to your door.</h2>
      </div>
    </div>

  </main>

  <!-- JavaScript Bundle -->
  <script src="assets/js/main.js"></script>
</body>
</html>
